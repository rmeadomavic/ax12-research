name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run tests
        run: python3 -m unittest tools/test_umbus.py tools/test_umbus_package.py tools/test_strace_parser.py tools/test_simulator.py -v
